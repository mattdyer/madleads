<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>madleads — Lead Management</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◆</span>
      <h1>madleads</h1>
    </div>
    <div class="actions">
      <button id="import-btn" class="btn">Import</button>
      <button id="export-btn" class="btn">Export</button>
      <button id="new-lead-btn" class="btn btn-primary">+ New Lead</button>
      <input id="import-file" type="file" accept="application/json,.json" hidden />
    </div>
  </header>

  <main class="container">
    <section class="stats" id="stats"></section>

    <section class="toolbar">
      <input id="search" type="search" placeholder="Search name, email or company…" />
      <select id="status-filter">
        <option value="">All statuses</option>
        <option value="new">New</option>
        <option value="contacted">Contacted</option>
        <option value="qualified">Qualified</option>
        <option value="proposal">Proposal</option>
        <option value="won">Won</option>
        <option value="lost">Lost</option>
      </select>
    </section>

    <section class="table-wrap">
      <table class="leads-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Company</th>
            <th>Contact</th>
            <th>Source</th>
            <th>Status</th>
            <th class="num">Value</th>
            <th class="actions-col"></th>
          </tr>
        </thead>
        <tbody id="leads-body"></tbody>
      </table>
      <p id="empty-state" class="empty" hidden>No leads found.</p>
    </section>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">New Lead</h2>
      <form id="lead-form">
        <input type="hidden" name="id" />
        <div class="grid">
          <label>Name *
            <input name="name" required maxlength="255" />
          </label>
          <label>Company
            <input name="company" maxlength="255" />
          </label>
          <label>Email
            <input name="email" type="email" maxlength="255" />
          </label>
          <label>Phone
            <input name="phone" maxlength="50" />
          </label>
          <label>Source
            <input name="source" maxlength="100" placeholder="website, referral…" />
          </label>
          <label>Status
            <select name="status">
              <option value="new">New</option>
              <option value="contacted">Contacted</option>
              <option value="qualified">Qualified</option>
              <option value="proposal">Proposal</option>
              <option value="won">Won</option>
              <option value="lost">Lost</option>
            </select>
          </label>
          <label>Value
            <input name="value" type="number" min="0" step="0.01" value="0" />
          </label>
          <label class="full">Notes
            <textarea name="notes" rows="3"></textarea>
          </label>
        </div>
        <p id="form-error" class="form-error" hidden></p>
        <div class="modal-actions">
          <button type="button" class="btn" data-close>Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
